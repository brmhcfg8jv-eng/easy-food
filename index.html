<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EasyFood — рецепты из того, что есть дома</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap&subset=cyrillic">
<style>
:root{--bg:#FFF8EE;--bg2:#FFF1DE;--card:#fff;--ink:#2B2118;--muted:#7C6B5A;--line:#F1E4D0;--or:#FF7A1A;--or-d:#E8620A;--or-l:#FFE9D6;--gr:#3FA34D;--gr-d:#2D8A3B;--gr-l:#E4F4E3;--sh:0 6px 24px rgba(120,70,20,.10);--sh2:0 14px 40px rgba(120,70,20,.18);--r:22px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#1B1612;--bg2:#241C16;--card:#2A211B;--ink:#F7ECDF;--muted:#B9A794;--line:#3A2E25;--or-l:#41271A;--gr-l:#1F3322;--sh:0 6px 24px rgba(0,0,0,.35);--sh2:0 14px 40px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#1B1612;--bg2:#241C16;--card:#2A211B;--ink:#F7ECDF;--muted:#B9A794;--line:#3A2E25;--or-l:#41271A;--gr-l:#1F3322;--sh:0 6px 24px rgba(0,0,0,.35);--sh2:0 14px 40px rgba(0,0,0,.5)}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.55;min-height:100%}
h1,h2,h3,.serif{font-family:'Playfair Display',Georgia,'Times New Roman',serif;line-height:1.15;margin:0}
button{font:inherit;cursor:pointer;border:0;color:inherit}input,select{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav-in{display:flex;align-items:center;gap:18px;height:68px}
.logo{display:flex;align-items:center;gap:10px;background:none;padding:0}
.logo b{font-family:'Playfair Display',serif;font-size:26px;letter-spacing:-.5px}.logo b i{font-style:normal;color:var(--or)}
.links{display:flex;gap:4px;margin-left:auto;align-items:center}
.lk{background:none;padding:9px 14px;border-radius:999px;font-weight:700;color:var(--muted);position:relative;transition:.2s;white-space:nowrap}
.lk:hover{color:var(--ink);background:var(--or-l)}.lk.on{color:var(--or-d);background:var(--or-l)}
.cnt{display:inline-block;min-width:20px;height:20px;line-height:20px;text-align:center;font-size:12px;background:var(--or);color:#fff;border-radius:99px;margin-left:6px;padding:0 5px}
.burger{display:none;margin-left:auto;background:var(--or-l);border-radius:12px;width:44px;height:44px;font-size:22px}
.theme{background:none;font-size:20px;width:40px;height:40px;border-radius:50%}.theme:hover{background:var(--or-l)}
@media(max-width:900px){.burger{display:block}.links{position:absolute;top:68px;left:0;right:0;background:var(--bg);flex-direction:column;align-items:stretch;padding:12px 20px 18px;border-bottom:1px solid var(--line);box-shadow:var(--sh);display:none;margin:0}.links.open{display:flex}.lk{text-align:left;padding:13px 14px}}
.hero{position:relative;overflow:hidden;background:radial-gradient(circle at 85% 20%,#FFD9B0 0,transparent 45%),radial-gradient(circle at 10% 90%,#CDEBC7 0,transparent 40%),var(--bg2);padding:64px 0 56px;border-bottom:1px solid var(--line)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero{background:radial-gradient(circle at 85% 20%,#4a2a15 0,transparent 45%),radial-gradient(circle at 10% 90%,#1f3a22 0,transparent 40%),var(--bg2)}}
:root[data-theme="dark"] .hero{background:radial-gradient(circle at 85% 20%,#4a2a15 0,transparent 45%),radial-gradient(circle at 10% 90%,#1f3a22 0,transparent 40%),var(--bg2)}
.hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:36px;align-items:center}
.hero h1{font-size:clamp(36px,6vw,64px);font-weight:800;letter-spacing:-1px}.hero h1 em{color:var(--or);font-style:normal}
.hero p.sub{font-size:clamp(17px,2.2vw,21px);color:var(--muted);margin:16px 0 26px;max-width:520px}
.search{display:flex;background:var(--card);border-radius:999px;box-shadow:var(--sh2);padding:7px;border:2px solid transparent;transition:.2s;max-width:600px}
.search:focus-within{border-color:var(--or)}
.search input{flex:1;min-width:0;border:0;background:none;padding:12px 18px;outline:none;font-size:17px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--or);color:#fff;font-weight:800;padding:12px 22px;border-radius:999px;transition:.2s;box-shadow:0 6px 16px rgba(255,122,26,.32);white-space:nowrap}
.btn:hover{background:var(--or-d);transform:translateY(-2px)}
.btn.gr{background:var(--gr);box-shadow:0 6px 16px rgba(63,163,77,.3)}.btn.gr:hover{background:var(--gr-d)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:none;border:2px solid var(--line)}.btn.ghost:hover{border-color:var(--or);background:var(--or-l);transform:none}
.btn.sm{padding:8px 14px;font-size:14px}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px;transition:.15s;color:var(--ink)}
.chip:hover{border-color:var(--or);transform:translateY(-1px)}.chip.on{background:var(--or);border-color:var(--or);color:#fff}
.chip.g.on{background:var(--gr);border-color:var(--gr)}
.hero-art{position:relative;height:340px}
.plate{position:absolute;border-radius:50%;background:var(--card);box-shadow:var(--sh2);display:grid;place-items:center;animation:float 6s ease-in-out infinite}
.plate span{filter:drop-shadow(0 6px 8px rgba(0,0,0,.18))}
@keyframes float{50%{transform:translateY(-12px)}}
@media(max-width:860px){.hero-grid{grid-template-columns:1fr}.hero-art{height:200px;order:-1}.hero{padding:36px 0}}
section.sec{padding:44px 0 6px}
.sec-h{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.sec-h h2{font-size:clamp(26px,3.6vw,36px)}.sec-h p{margin:4px 0 0;color:var(--muted)}
.more{background:none;color:var(--or-d);font-weight:800}.more:hover{text-decoration:underline}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:14px}
.cat{position:relative;border-radius:var(--r);padding:16px;min-height:130px;display:flex;flex-direction:column;justify-content:flex-end;text-align:left;overflow:hidden;color:#2B2118;box-shadow:var(--sh);transition:.25s}
.cat:hover{transform:translateY(-5px) scale(1.02);box-shadow:var(--sh2)}
.cat .em{position:absolute;right:-6px;top:-4px;font-size:68px;transition:.3s;filter:drop-shadow(0 6px 8px rgba(0,0,0,.15))}.cat:hover .em{transform:rotate(-10deg) scale(1.12)}
.cat b{font-size:17px;font-weight:800;line-height:1.2}.cat small{font-weight:700;opacity:.7}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;cursor:pointer;transition:.25s;display:flex;flex-direction:column;border:1px solid var(--line);text-align:left;padding:0;animation:pop .45s both}
.card:hover{transform:translateY(-6px);box-shadow:var(--sh2)}
@keyframes pop{from{opacity:0;transform:translateY(14px)}}
.img{position:relative;aspect-ratio:4/3;display:grid;place-items:center;overflow:hidden}
.img .disc{width:62%;aspect-ratio:1;border-radius:50%;background:var(--card);display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.18),inset 0 0 0 8px rgba(255,255,255,.5);transition:.4s}
.card:hover .disc{transform:scale(1.07) rotate(4deg)}
.img .e{font-size:clamp(52px,9vw,88px);line-height:1;filter:drop-shadow(0 6px 6px rgba(0,0,0,.2))}
.img .bub{position:absolute;border-radius:50%;background:rgba(255,255,255,.28)}
.fav{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.95);font-size:19px;box-shadow:0 3px 10px rgba(0,0,0,.15);transition:.2s;z-index:2;color:#999}
.fav:hover{transform:scale(1.15)}.fav.on{color:#E5384A}
.tags{position:absolute;left:10px;top:10px;display:flex;gap:5px;flex-wrap:wrap;max-width:75%}
.tag{font-size:12px;font-weight:800;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.95);color:#2B2118}.tag.v{background:#DFF3DC;color:#256B30}
.card-b{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.card-b h3{font-size:19px;font-family:'Nunito',sans-serif;font-weight:800;line-height:1.25}
.meta{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:14px;font-weight:700}
.miss{background:var(--or-l);color:var(--or-d);border-radius:12px;padding:7px 10px;font-size:13px;font-weight:700}
.ok{background:var(--gr-l);color:var(--gr-d);border-radius:12px;padding:7px 10px;font-size:13px;font-weight:800}
.page{padding:34px 0 60px;min-height:70vh}.page h1{font-size:clamp(30px,5vw,46px)}.page .lead{color:var(--muted);margin:8px 0 22px}
.filters{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh);margin-bottom:22px;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.filters .full{grid-column:1/-1}
.field label{display:block;font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.inp,.sel{width:100%;background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:10px 12px;outline:none}.inp:focus,.sel:focus{border-color:var(--or)}
.empty{text-align:center;padding:50px 20px;background:var(--card);border:2px dashed var(--line);border-radius:var(--r)}
.empty .big{font-size:64px}.empty h3{font-size:26px;margin:8px 0}.empty p{color:var(--muted);max-width:420px;margin:0 auto 18px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.pantry{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh);margin-bottom:26px}
.chips{display:flex;flex-wrap:wrap;gap:8px;max-height:230px;overflow:auto;padding:4px 2px;margin-top:12px}
.sel-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.ov{position:fixed;inset:0;background:rgba(30,18,8,.6);backdrop-filter:blur(4px);z-index:100;display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:24px 14px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--card);border-radius:28px;width:100%;max-width:880px;overflow:hidden;box-shadow:var(--sh2);animation:up .3s;position:relative;margin:auto 0}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.x{position:absolute;top:14px;right:14px;z-index:5;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.95);font-size:20px;box-shadow:0 3px 10px rgba(0,0,0,.2);color:#2B2118}
.m-img{aspect-ratio:21/9}.m-img .e{font-size:clamp(70px,14vw,130px)}.m-img .disc{width:auto;height:78%}
.m-b{padding:24px 28px 30px}.m-b h2{font-size:clamp(28px,4.5vw,40px)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:18px 0}
.stat{background:var(--bg);border-radius:16px;padding:10px 12px;text-align:center}.stat small{display:block;color:var(--muted);font-weight:700;font-size:12px}.stat b{font-size:17px}
.two{display:grid;grid-template-columns:.9fr 1.3fr;gap:30px;margin-top:10px}
@media(max-width:720px){.two{grid-template-columns:1fr}.m-b{padding:20px 16px 26px}}
.ing{list-style:none;padding:0;margin:10px 0 0}.ing li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}.ing li span:last-child{font-weight:800;color:var(--or-d);white-space:nowrap}
.steps{list-style:none;counter-reset:s;padding:0;margin:10px 0 0}.steps li{counter-increment:s;position:relative;padding:4px 0 16px 50px}
.steps li:before{content:counter(s);position:absolute;left:0;top:0;width:36px;height:36px;border-radius:50%;background:var(--or);color:#fff;font-weight:800;display:grid;place-items:center}
.serv{display:inline-flex;align-items:center;gap:10px;background:var(--bg);border-radius:999px;padding:4px}
.serv button{width:34px;height:34px;border-radius:50%;background:var(--card);font-size:20px;font-weight:800;box-shadow:var(--sh)}.serv b{min-width:24px;text-align:center}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.warn{background:#FFF3CD;color:#6B5200;border-radius:12px;padding:8px 12px;font-weight:700;font-size:14px;margin:8px 0}
.shop li{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:8px;list-style:none}
.shop li.done .nm{text-decoration:line-through;opacity:.5}.shop input{width:22px;height:22px;accent-color:var(--gr)}
.shop .nm{flex:1}.shop small{color:var(--muted);display:block}
.del{background:none;font-size:18px;color:var(--muted)}.del:hover{color:#d33}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#2B2118;color:#fff;padding:12px 20px;border-radius:999px;font-weight:700;z-index:200;box-shadow:var(--sh2);animation:up .25s;max-width:92vw;text-align:center}
.foot{background:var(--bg2);border-top:1px solid var(--line);padding:34px 0;color:var(--muted);font-size:14px}
.foot .wrap{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;align-items:center}
.banner{display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:linear-gradient(120deg,var(--gr),#6CC070);color:#fff;border-radius:28px;padding:28px 30px;margin-top:44px;box-shadow:var(--sh2)}
.banner h2{font-size:clamp(24px,3.5vw,34px)}.banner p{margin:6px 0 0;opacity:.95}
.banner .btn{background:#fff;color:var(--gr-d);box-shadow:none}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script>
/* ============ ДАННЫЕ ============ */
const CATS=[
["breakfast","Завтраки","🥞",35],["lunch","Обеды","🍛",25],["dinner","Ужины","🍽️",20],["soups","Супы","🍜",45],["salads","Салаты","🥗",110],
["appetizers","Закуски","🥟",30],["meat","Мясные блюда","🥩",8],["chicken","Курица","🍗",40],["fish","Рыба и морепродукты","🐟",200],["vegetarian","Вегетарианские","🥦",110],
["pasta","Паста","🍝",15],["rice","Блюда из риса","🍚",50],["potatoes","Картофель","🥔",42],["pizza","Пицца","🍕",12],["burgers","Бургеры","🍔",20],
["sandwiches","Сэндвичи","🥪",38],["kazakh","Казахская кухня","🐎",25],["russian","Русская кухня","🪆",10],["italian","Итальянская кухня","🇮🇹",5],["asian","Азиатская кухня","🥢",340],
["turkish","Турецкая кухня","🧿",18],["korean","Корейская кухня","🍱",320],["desserts","Десерты","🍮",330],["cakes","Торты","🎂",335],["pastries","Выпечка","🥐",30],
["bread","Хлеб","🍞",36],["cookies","Печенье","🍪",28],["smoothies","Смузи","🥤",340],["hot","Горячие напитки","☕",25],["cold","Холодные напитки","🧊",190]
].map(([id,name,emoji,hue])=>({id,name,emoji,hue}));

function R(id,name,cats,emoji,prep,cook,diff,serv,budget,pop,desc,ing,steps){
  return {id,name,cats:cats.split(","),emoji,prep,cook,time:prep+cook,diff,serv,budget,pop,desc,
    ing:ing.split("|").map(s=>{const [n,q,u]=s.split(";");return {name:n,qty:+q,unit:u,staple:STAPLES.includes(n)}}),
    steps:steps.split("|")};
}
const STAPLES=["Соль","Вода","Чёрный перец","Растительное масло"];
const RECIPES=[
R(1,"Бешбармак","kazakh,meat,dinner","🍲",30,150,3,6,3,98,"Главное блюдо казахского дастархана: нежная баранина, тонкое тесто и ароматный луковый бульон.","Баранина;1000;г|Лук репчатый;3;шт|Мука;400;г|Яйца;1;шт|Вода;2;л|Лавровый лист;2;шт|Соль;0;по вкусу|Чёрный перец;0;по вкусу","Мясо промойте, залейте холодной водой, доведите до кипения и снимите пену. Добавьте лавровый лист и варите на слабом огне около 2 часов.|Из муки, яйца, 120 мл воды и щепотки соли замесите крутое тесто. Накройте и оставьте на 30 минут.|Тесто тонко раскатайте и нарежьте ромбами или квадратами по 6 см. Лук нарежьте тонкими полукольцами.|Мясо достаньте и нарежьте. В кипящем бульоне отварите тесто 5–7 минут и выложите на большое блюдо.|Сверху разложите мясо, лук, залейте несколькими ложками бульона и поперчите. Бульон подайте отдельно в пиалах."),

function useLocal(k,init){
  const [v,setV]=useState(()=>{try{const s=localStorage.getItem(k);return s?JSON.parse(s):init}catch(e){return init}});
  useEffect(()=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},[k,v]);
  return [v,setV];
}

function matchInfo(r,sel){

function Catalog({ctx,preset}){
  const [q,setQ]=useState(preset.q||"");
  const [cat,setCat]=useState(preset.cat||"");
  const [time,setTime]=useState(preset.time||0);
  const [diff,setDiff]=useState(0);
  const [budget,setBudget]=useState(preset.budget||0);
  const [diet,setDiet]=useState("");
  const [sort,setSort]=useState(preset.sort||"pop");
  const reset=()=>{setQ("");setCat("");setTime(0);setDiff(0);setBudget(0);setDiet("");setSort("pop")};
  const list=useMemo(()=>{
    const terms=norm(q).split(/[,;]+/).map(s=>s.trim()).filter(Boolean);
    let l=RECIPES.filter(r=>{
      if(cat&&!r.cats.includes(cat))return false;
      if(time&&r.time>time)return false;
      if(diff&&r.diff!==+diff)return false;
      if(budget&&r.budget!==+budget)return false;
      if(diet==="veg"&&!r.veg)return false;
      if(diet==="gf"&&r.allergens.includes("Глютен"))return false;
      if(diet==="lf"&&r.allergens.includes("Молоко"))return false;
      if(diet==="ef"&&r.allergens.includes("Яйца"))return false;
      if(diet==="nf"&&r.allergens.includes("Орехи"))return false;
      return terms.every(t=>norm(r.name).includes(t)||r.ing.some(i=>norm(i.name).includes(t)));
    });
    return l.sort((a,b)=>sort==="time"?a.time-b.time:sort==="timeDesc"?b.time-a.time:b.pop-a.pop);
  },[q,cat,time,diff,budget,diet,sort]);
  const active=q||cat||time||diff||budget||diet;
  return html`<div className="wrap page">
    <h1 className="serif">${cat?catName(cat):"Все рецепты"}</h1>
    <p className="lead">Найдите блюдо по названию или ингредиенту. Несколько продуктов можно перечислить через запятую.</p>
    <div className="filters">
      <div className="field full"><label>Поиск</label><input className="inp" value=${q} onChange=${e=>setQ(e.target.value)} placeholder="Например: курица, сыр" /></div>
      <div className="field"><label>Категория</label><select className="sel" value=${cat} onChange=${e=>setCat(e.target.value)}><option value="">Все категории</option>${CATS.map(c=>html`<option key=${c.id} value=${c.id}>${c.name}</option>`)}</select></div>
      <div className="field"><label>Время</label><select className="sel" value=${time} onChange=${e=>setTime(+e.target.value)}><option value="0">Любое</option><option value="15">До 15 минут</option><option value="20">До 20 минут</option><option value="30">До 30 минут</option><option value="60">До 1 часа</option><option value="120">До 2 часов</option></select></div>
      <div className="field"><label>Сложность</label><select className="sel" value=${diff} onChange=${e=>setDiff(+e.target.value)}><option value="0">Любая</option><option value="1">Легко</option><option value="2">Средне</option><option value="3">Сложно</option></select></div>
      <div className="field"><label>Бюджет</label><select className="sel" value=${budget} onChange=${e=>setBudget(+e.target.value)}><option value="0">Любой</option><option value="1">Бюджетно</option><option value="2">Средний</option><option value="3">Дорого</option></select></div>
      <div className="field"><label>Диета</label><select className="sel" value=${diet} onChange=${e=>setDiet(e.target.value)}><option value="">Без ограничений</option><option value="veg">Вегетарианское</option><option value="gf">Без глютена</option><option value="lf">Без молока</option><option value="ef">Без яиц</option><option value="nf">Без орехов</option></select></div>
      <div className="field"><label>Сортировка</label><select className="sel" value=${sort} onChange=${e=>setSort(e.target.value)}><option value="pop">По популярности</option><option value="time">Сначала быстрые</option><option value="timeDesc">Сначала долгие</option></select></div>
    </div>
    <div className="meta" style=${{marginBottom:16,justifyContent:"space-between"}}><span>Найдено: ${list.length} ${plural(list.length,"рецепт","рецепта","рецептов")}</span>${active&&html`<button className="more" onClick=${reset}>Сбросить фильтры ✕</button>`}</div>
    ${list.length?html`<${Grid} list=${list} ctx=${ctx}/>`:html`<${Empty} icon="🔍" title="Ничего не найдено" text="Попробуйте изменить запрос или ослабить фильтры. Возможно, такого блюда пока нет в нашей базе." action="Сбросить фильтры" onAction=${reset}/>`}
  </div>`;
}

function Pantry({ctx}){
  const {sel,setSel}=ctx.pantry;const set=useMemo(()=>new Set(sel),[sel]);
  const [f,setF]=useState("");
  const toggle=n=>setSel(set.has(n)?sel.filter(x=>x!==n):[...sel,n]);

  const res=useMemo(()=>RECIPES.map(r=>({r,...matchInfo(r,set)})).filter(x=>x.have.length>0).sort((a,b)=>a.missing.length-b.missing.length||b.have.length-a.have.length||b.r.pop-a.r.pop),[set]);
  const ready=res.filter(x=>x.missing.length===0),almost=res.filter(x=>x.missing.length>0&&x.missing.length<=3),rest=res.filter(x=>x.missing.length>3).slice(0,8);
  const section=(title,list,sub)=>list.length>0&&html`<section style=${{marginTop:30}}><${SectionHead} title=${title} sub=${sub}/>
    <${Grid} list=${list.map(x=>x.r)} ctx=${ctx} extra=${r=>{const m=list.find(x=>x.r.id===r.id);return m.missing.length===0?html`<div className="ok">✓ Все продукты есть!</div>`:html`<div className="miss">Не хватает: ${m.missing.map(i=>i.name).join(", ")}<br/><button className="btn sm" style=${{marginTop:8}} onClick=${e=>{e.stopPropagation();ctx.addShop(m.missing,r.name,1)}}>🛒 Докупить недостающее</button></div>`}}/></section>`;
  return html`<div className="wrap page">
    <h1 className="serif">Что приготовить из того, что есть дома?</h1>
    <p className="lead">Отметьте продукты, которые у вас есть. Соль, воду, перец и растительное масло мы считаем всегда имеющимися.</p>
    <div className="pantry">
      <input className="inp" value=${f} onChange=${e=>setF(e.target.value)} placeholder="Найти продукт в списке…"/>
      <div className="chips">${shown.length?shown.map(n=>html`<button key=${n} className=${"chip g"+(set.has(n)?" on":"")} onClick=${()=>toggle(n)}>${set.has(n)?"✓ ":""}${n}</button>`):html`<span className="meta">Такого продукта нет в списке</span>`}</div>
      <div className="sel-bar"><b>Выбрано: ${sel.length}</b>${sel.length>0&&html`<button className="btn ghost sm" onClick=${()=>setSel([])}>Очистить выбор</button>`}</div>
      ${sel.length>0&&html`<div className="chips" style=${{maxHeight:"none"}}>${sel.map(n=>html`<button key=${n} className="chip on" onClick=${()=>toggle(n)}>${n} ✕</button>`)}</div>`}
    </div>
    ${sel.length===0?html`<${Empty} icon="🧺" title="Пока ничего не выбрано" text="Нажмите на продукты выше — и мы сразу покажем подходящие рецепты и подскажем, чего не хватает."/>`
      :res.length===0?html`<${Empty} icon="🤔" title="Подходящих рецептов нет" text="Попробуйте добавить больше продуктов — например, яйца, картофель или лук."/>`
      :html`<div>
        ${section("Можно готовить прямо сейчас",ready,"У вас есть все ингредиенты")}
        ${section("Почти всё есть",almost,"Не хватает не более трёх продуктов")}
        ${section("Частичное совпадение",rest,"Потребуется докупить больше")}
        ${ready.length===0&&almost.length===0&&html`<p className="lead" style=${{marginTop:20}}>Совсем точных совпадений нет — но вот что можно приготовить, если докупить продукты.</p>`}
      </div>`}
  </div>`;
}

          <div>
            <h3 className="serif" style=${{fontSize:26}}>Ингредиенты</h3>
            <div className="serv" style=${{marginTop:10}}><button aria-label="Меньше порций" onClick=${()=>setS(Math.max(1,s-1))}>−</button><b>${s}</b><button aria-label="Больше порций" onClick=${()=>setS(Math.min(20,s+1))}>+</button><span style=${{paddingRight:12,fontWeight:700}}>${plural(s,"порция","порции","порций")}</span></div>
            <ul className="ing">${r.ing.map(i=>html`<li key=${i.name}><span>${i.name}</span><span>${qtyText(i,f)}</span></li>`)}</ul>
          </div>
          <div><h3 className="serif" style=${{fontSize:26}}>Приготовление</h3>
            <ol className="steps">${r.steps.map((t,i)=>html`<li key=${i}>${t}</li>`)}</ol></div>
        </div>
      </div></div></div>`;
}

function App(){
  const [page,setPage]=useState("home");
  const [preset,setPreset]=useState({});
  const [openId,setOpenId]=useState(null);
  const [isRandom,setIsRandom]=useState(false);
  const [favs,setFavs]=useLocal("ef_favs",[]);
  const [shop,setShop]=useLocal("ef_shop",[]);
  const [viewed,setViewed]=useLocal("ef_viewed",[]);
  const [cooked,setCooked]=useLocal("ef_cooked",{});
  const [sel,setSel]=useLocal("ef_pantry",[]);
  const [theme,setTheme]=useLocal("ef_theme",window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
  const [msg,setMsg]=useState(null);const tRef=useRef();
  useEffect(()=>{document.documentElement.setAttribute("data-theme",theme)},[theme]);
  const toast=m=>{setMsg(m);clearTimeout(tRef.current);tRef.current=setTimeout(()=>setMsg(null),2400)};
  const go=(p,pr={})=>{setPage(p);setPreset(pr);setOpenId(null);window.scrollTo({top:0,behavior:"smooth"})};
  const open=id=>{setOpenId(id);setViewed(v=>[id,...v.filter(x=>x!==id)].slice(0,12))};
  const toggleFav=id=>{const has=favs.includes(id);setFavs(has?favs.filter(x=>x!==id):[id,...favs]);toast(has?"Удалено из избранного":"Добавлено в избранное ❤️")};
  const markCooked=id=>{setCooked(c=>({...c,[id]:(c[id]||0)+1}));toast("Отлично! Рецепт отмечен как приготовленный 👨‍🍳")};
  const addShop=(items,name,f)=>{
    if(!items.length){toast("Добавлять нечего — все продукты уже есть");return}
    setShop(list=>{const l=list.map(x=>({...x,src:[...x.src]}));
      items.forEach(it=>{const q=it.qty*f;const ex=l.find(x=>x.name===it.name&&x.unit===it.unit);
        if(ex){ex.qty+=q;if(!ex.src.includes(name))ex.src.push(name)}else l.push({id:it.name+"|"+it.unit,name:it.name,qty:q,unit:it.unit,done:false,src:[name]})});
      return l});
    toast(`Добавлено в список покупок: ${items.length} ${plural(items.length,"продукт","продукта","продуктов")} 🛒`);
  };
  const random=()=>{let r;do{r=RECIPES[Math.floor(Math.random()*RECIPES.length)]}while(r.id===openId&&RECIPES.length>1);setIsRandom(true);open(r.id)};
  const ctx={favs,toggleFav,viewed,setViewed,cooked,markCooked,shop,setShop,addShop,open:id=>{setIsRandom(false);open(id)},random,toast,pantry:{sel,setSel}};
  const counts={fav:favs.length,shop:shop.filter(i=>!i.done).length};
  return html`<div>
    <${Navbar} page=${page} go=${go} counts=${counts} theme=${theme} toggleTheme=${()=>setTheme(theme==="dark"?"light":"dark")}/>
    <main>
      ${page==="home"&&html`<${Home} ctx=${ctx} go=${go}/>`}
      ${page==="catalog"&&html`<${Catalog} key=${JSON.stringify(preset)} ctx=${ctx} preset=${preset}/>`}
      ${page==="pantry"&&html`<${Pantry} ctx=${ctx}/>`}
      ${page==="fav"&&html`<${Favorites} ctx=${ctx} go=${go}/>`}
      ${page==="shop"&&html`<${Shopping} ctx=${ctx} go=${go}/>`}
    </main>
    <footer className="foot"><div className="wrap"><${Logo} onClick=${()=>go("home")}/><span>Учебный проект · ${RECIPES.length} рецептов в локальной базе · избранное и список покупок хранятся в вашем браузере</span></div></footer>
    ${openId&&html`<${Modal} id=${openId} ctx=${ctx} isRandom=${isRandom} onClose=${()=>setOpenId(null)}/>`}
    ${msg&&html`<div className="toast" role="status">${msg}</div>`}
  </div>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body></html>
